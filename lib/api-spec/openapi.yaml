openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Kracken Study application API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and sessions
  - name: dashboard
    description: Dashboard aggregates
  - name: library
    description: Study library content
  - name: users
    description: Admin user management
  - name: settings
    description: Website customization
  - name: storage
    description: Persistent object storage
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Get the current session
      responses:
        "200":
          description: Current session or signed-out state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with a username or email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Invalid credentials or expired account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Signed out
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard statistics and recent resources
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /trades:
    get:
      operationId: listTrades
      tags: [library]
      summary: List trades
      responses:
        "200":
          description: Trades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"
    post:
      operationId: createTrade
      tags: [library]
      summary: Create a trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeInput"
      responses:
        "201":
          description: Trade created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
  /trades/{tradeId}:
    get:
      operationId: getTrade
      tags: [library]
      summary: Get a trade
      parameters:
        - $ref: "#/components/parameters/TradeId"
      responses:
        "200":
          description: Trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeDetail"
    patch:
      operationId: updateTrade
      tags: [library]
      summary: Update a trade
      parameters:
        - $ref: "#/components/parameters/TradeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeUpdate"
      responses:
        "200":
          description: Trade updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
    delete:
      operationId: deleteTrade
      tags: [library]
      summary: Delete a trade
      parameters:
        - $ref: "#/components/parameters/TradeId"
      responses:
        "204":
          description: Trade deleted
  /trades/{tradeId}/chapters:
    get:
      operationId: listChapters
      tags: [library]
      summary: List chapters inside a trade
      parameters:
        - $ref: "#/components/parameters/TradeId"
      responses:
        "200":
          description: Chapters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chapter"
    post:
      operationId: createChapter
      tags: [library]
      summary: Create a chapter inside a trade
      parameters:
        - $ref: "#/components/parameters/TradeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChapterInput"
      responses:
        "201":
          description: Chapter created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chapter"
  /chapters/{chapterId}:
    get:
      operationId: getChapter
      tags: [library]
      summary: Get a chapter
      parameters:
        - $ref: "#/components/parameters/ChapterId"
      responses:
        "200":
          description: Chapter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterDetail"
    patch:
      operationId: updateChapter
      tags: [library]
      summary: Update a chapter
      parameters:
        - $ref: "#/components/parameters/ChapterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChapterUpdate"
      responses:
        "200":
          description: Chapter updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chapter"
    delete:
      operationId: deleteChapter
      tags: [library]
      summary: Delete a chapter
      parameters:
        - $ref: "#/components/parameters/ChapterId"
      responses:
        "204":
          description: Chapter deleted
  /chapters/{chapterId}/resources:
    get:
      operationId: listResources
      tags: [library]
      summary: List resources inside a chapter
      parameters:
        - $ref: "#/components/parameters/ChapterId"
      responses:
        "200":
          description: Resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
    post:
      operationId: createResource
      tags: [library]
      summary: Add a resource to a chapter
      parameters:
        - $ref: "#/components/parameters/ChapterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceInput"
      responses:
        "201":
          description: Resource created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
  /resources/{resourceId}:
    patch:
      operationId: updateResource
      tags: [library]
      summary: Update a resource
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceUpdate"
      responses:
        "200":
          description: Resource updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
    delete:
      operationId: deleteResource
      tags: [library]
      summary: Delete a resource
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Resource deleted
  /search:
    get:
      operationId: searchLibrary
      tags: [library]
      summary: Search trades, chapters, and resources
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List managed accounts
      responses:
        "200":
          description: Managed accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a managed account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{userId}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update, enable, disable, or reset a managed account
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Account updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a managed account
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Account deleted
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get website settings
      responses:
        "200":
          description: Website settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update website settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid upload metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      operationId: getPublicObject
      tags: [storage]
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public file
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Serve a private object entity
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stored file
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  parameters:
    TradeId:
      name: tradeId
      in: path
      required: true
      schema:
        type: string
    ChapterId:
      name: chapterId
      in: path
      required: true
      schema:
        type: string
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Session:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        user:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
    LoginInput:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    Trade:
      type: object
      required: [id, name, slug, description, imageUrl, chapterCount, resourceCount]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        imageUrl: { type: ["string", "null"] }
        chapterCount: { type: integer }
        resourceCount: { type: integer }
        order: { type: integer }
    TradeDetail:
      allOf:
        - $ref: "#/components/schemas/Trade"
        - type: object
          required: [chapters]
          properties:
            chapters:
              type: array
              items:
                $ref: "#/components/schemas/Chapter"
    TradeInput:
      type: object
      required: [name, description]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        imageUrl: { type: ["string", "null"] }
        order: { type: integer, minimum: 0 }
    TradeUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        imageUrl: { type: ["string", "null"] }
        order: { type: integer, minimum: 0 }
    Chapter:
      type: object
      required: [id, tradeId, name, description, imageUrl, resourceCount, order]
      properties:
        id: { type: string }
        tradeId: { type: string }
        name: { type: string }
        description: { type: string }
        imageUrl: { type: ["string", "null"] }
        resourceCount: { type: integer }
        order: { type: integer }
    ChapterDetail:
      allOf:
        - $ref: "#/components/schemas/Chapter"
        - type: object
          required: [tradeName, resources]
          properties:
            tradeName: { type: string }
            resources:
              type: array
              items:
                $ref: "#/components/schemas/Resource"
    ChapterInput:
      type: object
      required: [name, description]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        imageUrl: { type: ["string", "null"] }
        order: { type: integer, minimum: 0 }
    ChapterUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        imageUrl: { type: ["string", "null"] }
        order: { type: integer, minimum: 0 }
    Resource:
      type: object
      required: [id, chapterId, title, description, fileUrl, fileName, fileSize, mimeType, order]
      properties:
        id: { type: string }
        chapterId: { type: string }
        title: { type: string }
        description: { type: string }
        fileUrl: { type: string }
        fileName: { type: string }
        fileSize: { type: integer }
        mimeType: { type: string }
        thumbnailUrl: { type: ["string", "null"] }
        order: { type: integer }
        createdAt: { type: string, format: date-time }
    ResourceInput:
      type: object
      required: [title, fileUrl, fileName, fileSize, mimeType]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        fileUrl: { type: string, minLength: 1 }
        fileName: { type: string, minLength: 1 }
        fileSize: { type: integer, minimum: 1 }
        mimeType: { type: string, minLength: 1 }
        thumbnailUrl: { type: ["string", "null"] }
        order: { type: integer, minimum: 0 }
    ResourceUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        fileUrl: { type: string }
        fileName: { type: string }
        fileSize: { type: integer, minimum: 1 }
        mimeType: { type: string }
        thumbnailUrl: { type: ["string", "null"] }
        order: { type: integer, minimum: 0 }
    User:
      type: object
      required: [id, username, role, status, expiresAt, createdAt]
      properties:
        id: { type: string }
        username: { type: string }
        role:
          type: string
          enum: [admin, student]
        status:
          type: string
          enum: [active, disabled, expired]
        expiresAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        lastActiveAt: { type: ["string", "null"], format: date-time }
    UserInput:
      type: object
      required: [username, password, duration]
      properties:
        username: { type: string, minLength: 2 }
        password: { type: string, minLength: 8 }
        duration:
          type: string
          enum: [hour, day, week, month, custom]
        customExpiresAt: { type: ["string", "null"], format: date-time }
    UserUpdate:
      type: object
      properties:
        username: { type: string, minLength: 2 }
        password: { type: ["string", "null"], minLength: 8 }
        status:
          type: string
          enum: [active, disabled]
        duration:
          type: string
          enum: [hour, day, week, month, custom]
        customExpiresAt: { type: ["string", "null"], format: date-time }
    Settings:
      type: object
      required: [siteName, logoUrl, faviconUrl, backgroundImageUrl, brandingImageUrl, brandingText, aboutText, instagramUsername, instagramUrl, footerText]
      properties:
        siteName: { type: string }
        logoUrl: { type: ["string", "null"] }
        faviconUrl: { type: ["string", "null"] }
        backgroundImageUrl: { type: ["string", "null"] }
        brandingImageUrl: { type: ["string", "null"] }
        brandingText: { type: string }
        aboutText: { type: string }
        instagramUsername: { type: string }
        instagramUrl: { type: ["string", "null"] }
        footerText: { type: string }
    SettingsUpdate:
      type: object
      properties:
        siteName: { type: string, minLength: 1 }
        logoUrl: { type: ["string", "null"] }
        faviconUrl: { type: ["string", "null"] }
        backgroundImageUrl: { type: ["string", "null"] }
        brandingImageUrl: { type: ["string", "null"] }
        brandingText: { type: string }
        aboutText: { type: string }
        instagramUsername: { type: string }
        instagramUrl: { type: ["string", "null"], format: uri }
        footerText: { type: string }
    DashboardSummary:
      type: object
      required: [stats, featuredTrades, recentResources]
      properties:
        stats:
          type: object
          required: [totalUsers, activeUsers, expiredUsers, totalTrades, totalChapters, totalResources]
          properties:
            totalUsers: { type: integer }
            activeUsers: { type: integer }
            expiredUsers: { type: integer }
            totalTrades: { type: integer }
            totalChapters: { type: integer }
            totalResources: { type: integer }
        featuredTrades:
          type: array
          items:
            $ref: "#/components/schemas/Trade"
        recentResources:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
    SearchResult:
      type: object
      required: [id, type, title, subtitle, href]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [trade, chapter, resource]
        title: { type: string }
        subtitle: { type: string }
        href: { type: string }
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath, metadata]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"